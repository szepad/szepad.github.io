    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style/contact.css">

<body>
    <header>
        <nav class="navbar" aria-label="Main">
            <a href="index.html" class="logo">Szép Adrián<span class="logo-extra"> Attila</span></a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
                <i class="fa-solid fa-bars icon-open" aria-hidden="true"></i>
                <i class="fa-solid fa-xmark icon-close" aria-hidden="true"></i>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="apps.html">Apps</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="contact">
        <div class="contact-container card-surface">
            <h1>Contact me!</h1>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe" maxlength="50" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com" maxlength="100" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="Subject" maxlength="100">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
                </div>
                <!-- Spam trap for Web3Forms: real visitors never see or tick this -->
                <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
                <div class="cta-buttons form-buttons">
                    <button type="submit" class="btn btn-green">Send Message</button>
                    <button type="reset" class="btn btn-transparent">Reset</button>
                </div>
                <p id="form-status" class="visually-hidden" role="status"></p>
            </form>
        </div>
        <div class="social-icons contact-socials">
            <a href="https://github.com/szepad" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
            <a href="https://www.linkedin.com/in/adrian-szep/" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
            <button type="button" class="email-btn" data-email="szepad06@gmail.com" aria-label="Copy email address szepad06@gmail.com">
                <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                <span class="tooltip-text" aria-hidden="true">szepad06@gmail.com</span>
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Szép Adrián Attila. All rights reserved.</p>
    </footer>
    <script src="scripts/main.js"></script>
</body>
</html>
