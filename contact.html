<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szép Adrián Attila - Contact</title>
    <meta name="description" content="Get in touch with Szép Adrián Attila, or contact MyBulk app support.">
    <meta name="theme-color" content="#15181e">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Szép Adrián Attila">
    <meta property="og:title" content="Szép Adrián Attila - Contact">
    <meta property="og:description" content="Get in touch, or contact MyBulk app support.">
    <meta property="og:url" content="https://szepad.github.io/contact.html">
    <meta property="og:image" content="https://szepad.github.io/media/portrait.jpg">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:ital,wght@0,400..900;1,400..900&display=swap">
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/contact.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="index.html"><img src="media/avatar.jpg" width="80" height="80" alt=""><span class="signature">Szép Adrián Attila</span></a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
                <span class="when-closed">Menu</span><span class="when-open">Close</span>
            </button>
            <nav class="site-nav" id="site-nav" aria-label="Main">
                <a href="index.html"><span class="nav-num" aria-hidden="true">01</span>About</a>
                <a href="projects.html"><span class="nav-num" aria-hidden="true">02</span>Projects</a>
                <a href="apps.html"><span class="nav-num" aria-hidden="true">03</span>Apps</a>
                <a href="contact.html" aria-current="page"><span class="nav-num" aria-hidden="true">04</span>Contact</a>
            </nav>
        </div>
    </header>

    <main id="main" class="wrap contact">
        <div class="contact-intro">
            <h1>Contact me!</h1>
            <p class="contact-sub">Or reach me directly:</p>
            <ul class="cells">
                <li class="cell">
                    <span class="cell-label">Email</span>
                    <span class="cell-value">szepad06@gmail.com</span>
                    <button type="button" class="copy-btn" data-email="szepad06@gmail.com" aria-label="Copy email address">Copy</button>
                </li>
                <li>
                    <a class="cell cell-link" href="https://github.com/szepad" target="_blank" rel="noopener">
                        <span class="cell-label">GitHub</span>
                        <span class="cell-value">github.com/szepad</span>
                        <span class="cell-go" aria-hidden="true">↗</span>
                    </a>
                </li>
                <li>
                    <a class="cell cell-link" href="https://www.linkedin.com/in/adrian-szep/" target="_blank" rel="noopener">
                        <span class="cell-label">LinkedIn</span>
                        <span class="cell-value">in/adrian-szep</span>
                        <span class="cell-go" aria-hidden="true">↗</span>
                    </a>
                </li>
            </ul>
            <p id="copy-status" class="visually-hidden" role="status"></p>
        </div>

        <form id="contact-form" class="contact-form">
            <fieldset class="topic">
                <legend>What is it about?</legend>
                <div class="segmented">
                    <label class="segment"><input type="radio" name="topic" value="General" checked><span>General</span></label>
                    <label class="segment"><input type="radio" name="topic" value="MyBulk support"><span>MyBulk support</span></label>
                </div>
            </fieldset>

            <div class="field-row">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe" maxlength="50" autocomplete="name">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com" maxlength="100" autocomplete="email">
                </div>
            </div>
            <div class="field">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required placeholder="Subject" maxlength="100">
            </div>
            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
            </div>

            <!-- Spam trap for Web3Forms: real visitors never see or tick this -->
            <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Send message <span class="arrow" aria-hidden="true">→</span></button>
                <p id="form-status" class="form-status" role="status"></p>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <div class="footer-meta">
                <span>&copy; 2026 Szép Adrián Attila</span>
                <ul class="footer-links">
                    <li><a class="pill" href="https://github.com/szepad/" target="_blank" rel="noopener">GitHub ↗</a></li>
                    <li><a class="pill" href="https://www.linkedin.com/in/adrian-szep/" target="_blank" rel="noopener">LinkedIn ↗</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script src="scripts/main.js"></script>
</body>
</html>
